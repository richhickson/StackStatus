# XcodeGen spec. Regenerate the project with `xcodegen generate` after editing.
# The generated StackStatus.xcodeproj is committed so the project builds with
# plain xcodebuild and without XcodeGen installed.
name: StackStatus
options:
  bundleIdPrefix: com.helpfullyit
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: DFL38M27U3
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  StackStatus:
    type: application
    platform: macOS
    sources:
      - path: StackStatus
        excludes:
          - "Resources/Info.plist"
      - path: StackStatusInstaller/InstallerProtocol.swift
    dependencies:
      - target: StackStatusInstaller
        embed: true
    info:
      path: StackStatus/Resources/Info.plist
      properties:
        CFBundleName: StackStatus
        CFBundleDisplayName: StackStatus
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "Copyright 2026 Rich Hickson, Helpfully IT. MIT licence."
        NSPrincipalClass: NSApplication
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: StackStatus/Resources/StackStatus.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.helpfullyit.stackstatus
        PRODUCT_NAME: StackStatus
        ENABLE_HARDENED_RUNTIME: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: ""
    preBuildScripts:
      - name: Merge vendor definitions
        script: |
          "$SRCROOT/Scripts/merge-vendors.sh" "$SRCROOT/vendors" "$DERIVED_FILE_DIR/vendors.json"
        inputFiles:
          - $(SRCROOT)/Scripts/merge-vendors.sh
        outputFiles:
          - $(DERIVED_FILE_DIR)/vendors.json
    postCompileScripts:
      - name: Copy merged vendors.json into bundle
        script: |
          mkdir -p "$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          cp "$DERIVED_FILE_DIR/vendors.json" "$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/vendors.json"
        inputFiles:
          - $(DERIVED_FILE_DIR)/vendors.json
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/vendors.json
  StackStatusInstaller:
    # Not sandboxed on purpose: a sandboxed process cannot write a launchable
    # app bundle. See StackStatusInstaller/main.swift. Embedded in the app.
    type: xpc-service
    platform: macOS
    sources:
      - path: StackStatusInstaller
      - path: StackStatus/Core/Shared/UpdateVerification.swift
    info:
      path: StackStatusInstaller/Info.plist
      properties:
        CFBundleName: StackStatusInstaller
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        XPCService:
          ServiceType: Application
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.helpfullyit.stackstatus.installer
        PRODUCT_NAME: StackStatusInstaller
        ENABLE_HARDENED_RUNTIME: "YES"
        SKIP_INSTALL: "YES"
  StackStatusTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: StackStatusTests
    dependencies:
      - target: StackStatus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.helpfullyit.stackstatus.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/StackStatus.app/Contents/MacOS/StackStatus
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  StackStatus:
    build:
      targets:
        StackStatus: all
        StackStatusTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StackStatusTests
      gatherCoverageData: false
    archive:
      config: Release
