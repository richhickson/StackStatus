name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate vendor definitions
        run: Scripts/merge-vendors.sh vendors "$RUNNER_TEMP/vendors.json" && cat "$RUNNER_TEMP/vendors.json" | head -20
      - name: Show Xcode
        run: xcodebuild -version
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project StackStatus.xcodeproj \
            -scheme StackStatus \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            | grep -E 'error:|warning:|Test Case.*failed|Executed|TEST (SUCCEEDED|FAILED)|\*\* ' \
            | grep -v -E 'appintentsmetadata|Metadata extraction'
      - name: No em dashes in README, app copy or comments
        run: |
          if grep -rn --include='*.md' --include='*.swift' --include='*.json' --include='*.sh' --include='*.yml' -- '—' . --exclude-dir=build --exclude-dir=.git; then
            echo "em dash found" >&2; exit 1
          fi
